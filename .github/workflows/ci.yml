name: ci

on:
  push:
  pull_request:

# This job's name is what `main`'s branch protection WOULD require, and
# there is none: GitHub Free offers no rulesets or protected branches on a
# private repository, so nothing on the server can require a status check.
# A pre-commit hook can be bypassed with --no-verify and is absent from a
# fresh clone until `make hooks`. What is left is hooks plus visible CI -
# this job, the verified-line workflow beside it, and two badges at the top
# of the README. See AGENTS.md; the Team-plan upgrade is a business call.
jobs:
  simulator-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.12 on purpose, and NOT the 3.10 that docker/Dockerfile pins:
          # this job installs no CARLA client wheel (that is gate G1), so it
          # is free to run on the upper end of requires-python and prove the
          # simulator-free suite is not accidentally 3.10-only. The wheel is
          # what forces 3.10, and it is only in the image.
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/simforge-frames"
          pip install -e ".[dev]"

      - name: Suite
        # Deliberately WITHOUT the carla client wheel installed. The suite
        # must stay runnable with no simulator; that is gate G1.
        run: make test

      - name: simforge-frames stays proto-free
        # Its whole reason for existing - see ADR-017 in
        # simforge-closed-loop. A proto import here breaks that repo.
        run: python -m pytest tests/test_frames_packaging.py -q

      - name: Vendored stubs match proto/
        run: |
          bash tools/gen_protos.sh
          git diff --exit-code src/alpasim_carla/_proto \
            || { echo "Stubs differ from proto/. Run make protos and commit."; exit 1; }
