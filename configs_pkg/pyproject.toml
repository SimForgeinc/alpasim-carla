[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpasim-carla-configs"
version = "0.1.0"
description = "Hydra config package that registers renderer=carla with the AlpaSim wizard (alpasim.configs entry point). Pure YAML - install this into the (Python 3.12) environment that runs alpasim_wizard; the alpasim-carla bridge itself is a separate Python 3.10 process."
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

[project.entry-points."alpasim.configs"]
carla = "alpasim_carla_configs.configs"

[tool.setuptools.packages.find]
where = ["."]
include = ["alpasim_carla_configs*"]

[tool.setuptools.package-data]
alpasim_carla_configs = ["**/*.yaml"]
